<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>手机速查使用说明</title>
  <style>
    :root { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; color: #18202b; background: #f7f8fa; }
    body { margin: 0; }
    main { max-width: 680px; margin: auto; padding: 42px 20px 70px; }
    h1 { margin: 0 0 10px; font-size: 34px; letter-spacing: -.04em; }
    .lead { color: #66707c; font-size: 17px; line-height: 1.7; }
    section { margin-top: 26px; padding: 20px; border: 1px solid #e4e8ed; border-radius: 18px; background: white; }
    h2 { margin: 0 0 12px; font-size: 18px; }
    ol { margin: 0; padding-left: 22px; line-height: 1.85; }
    .tip { color: #1d4f91; font-weight: 650; }
  </style>
</head>
<body>
  <main>
    <h1>欢迎使用手机速查</h1>
    <p class="lead">这里集中保存 Codex 为你生成、适合随手翻阅的 HTML。原文件仍留在原项目，这里只保存手机发布版。</p>
    <section>
      <h2>以后怎么发布</h2>
      <ol>
        <li>让 Codex 生成或更新 HTML。</li>
        <li>告诉 Codex：“发布到手机速查”。</li>
        <li>在 iPhone 上刷新首页即可。</li>
      </ol>
    </section>
    <section>
      <h2>链接规则</h2>
      <p class="lead">每份内容都有固定链接。以后更新同一主题时，正文会更新，原来的收藏链接不会改变。</p>
      <p class="tip">首页负责找内容，独立链接负责收藏和分享。</p>
    </section>
  </main>
</body>
</html>
